# Mevcut Nginx kurulumuna uyarlanacak HTTP yapılandırması.
# HTTPS sertifikası kurulduktan sonra 443 yapılandırması eklenmelidir.
server {
    listen 80;
    server_name assan.qmaris.com.tr;
    root /var/www/assan.qmaris.com.tr/current;
    index index.html;

    charset utf-8;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
